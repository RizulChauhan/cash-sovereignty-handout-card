<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 600" width="1050" height="600">
  <!-- Standard Business Card 3.5" x 2" @ 300 DPI (1050 x 600) -->
  <rect width="1050" height="600" fill="#FFFFFF" stroke="#000000" stroke-width="8"/>
  <rect x="20" y="20" width="1010" height="560" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Back Header Row -->
  <text x="50" y="70" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="900" fill="#000000" letter-spacing="-0.5">4 REASONS CASH PROTECTS YOU</text>
  <rect x="850" y="45" width="150" height="34" rx="6" fill="#000000"/>
  <text x="925" y="68" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">PEER-TO-PEER</text>
  <line x1="50" y1="95" x2="1000" y2="95" stroke="#000000" stroke-width="4"/>

  <!-- 4 Benefits Grid -->
  <!-- Col 1, Row 1 -->
  <circle cx="60" cy="140" r="5" fill="#000000"/>
  <text x="75" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#000000">Surveillance-Free</text>
  <text x="75" y="175" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="500" fill="#334155">Digital transactions log your identity, location,</text>
  <text x="75" y="198" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="500" fill="#334155">and purchase history. Cash leaves zero data trail.</text>

  <!-- Col 2, Row 1 -->
  <circle cx="550" cy="140" r="5" fill="#000000"/>
  <text x="565" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#000000">Grid-Proof Resilience</text>
  <text x="565" y="175" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="500" fill="#334155">When cell towers fail, payment servers crash,</text>
  <text x="565" y="198" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="500" fill="#334155">or the power goes out, cash always works.</text>

  <!-- Col 1, Row 2 -->
  <circle cx="60" cy="255" r="5" fill="#000000"/>
  <text x="75" y="260" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#000000">Immune to Freezes</text>
  <text x="75" y="290" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="500" fill="#334155">No bank or fintech algorithm can block your trade,</text>
  <text x="75" y="313" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="500" fill="#334155">charge arbitrary fees, or seize physical notes.</text>

  <!-- Col 2, Row 2 -->
  <circle cx="550" cy="255" r="5" fill="#000000"/>
  <text x="565" y="260" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#000000">Use It or Lose It</text>
  <text x="565" y="290" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="500" fill="#334155">If society stops using cash, states will eliminate</text>
  <text x="565" y="313" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="500" fill="#334155">it completely—erasing our last private tool.</text>

  <!-- CTA Box -->
  <rect x="50" y="360" width="950" height="110" rx="10" fill="#000000"/>
  <text x="80" y="410" font-family="'Space Grotesk', sans-serif" font-size="26" font-weight="900" fill="#FFFFFF" letter-spacing="1">KEEP CASH IN CIRCULATION</text>
  <text x="80" y="445" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="500" fill="#CBD5E1">Spend cash often. Accept cash proudly. Guard your personal liberty.</text>
  
  <rect x="810" y="390" width="165" height="48" rx="6" fill="#FFFFFF"/>
  <text x="892" y="422" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="800" fill="#000000" text-anchor="middle" letter-spacing="1">SPEND CASH</text>

  <!-- Footer -->
  <line x1="50" y1="510" x2="1000" y2="510" stroke="#E2E8F0" stroke-width="2"/>
  <text x="50" y="545" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#64748B">Pass this card to the next merchant</text>
  <text x="1000" y="545" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#64748B" text-anchor="end">Free to print &amp; distribute (CC0 Public Domain)</text>
</svg>
