<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 600" width="1050" height="600">
  <!-- Standard Business Card 3.5" x 2" @ 300 DPI (1050 x 600) -->
  <rect width="1050" height="600" fill="#FFFFFF" stroke="#000000" stroke-width="8"/>
  <rect x="20" y="20" width="1010" height="560" fill="none" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Header Row -->
  <rect x="50" y="45" width="230" height="36" rx="6" fill="#000000"/>
  <text x="165" y="69" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">FINANCIAL FREEDOM</text>
  <text x="1000" y="70" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#000000" text-anchor="end" letter-spacing="1">3.5" × 2" MONOCHROME</text>
  <line x1="50" y1="95" x2="1000" y2="95" stroke="#000000" stroke-width="4"/>

  <!-- Headline -->
  <text x="50" y="175" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="54" font-weight="900" fill="#000000" letter-spacing="-1.5">WHY CASH STILL</text>
  <text x="50" y="235" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="54" font-weight="900" fill="#000000" letter-spacing="-1.5">MATTERS MOST.</text>
  
  <text x="50" y="285" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="600" fill="#1E293B">You just accepted real, private, offline money. Thank you for</text>
  <text x="50" y="318" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="600" fill="#1E293B">keeping financial independence alive in a surveilled world.</text>

  <!-- 3 Pillars Box -->
  <rect x="50" y="360" width="950" height="120" rx="10" fill="#F8FAFC" stroke="#000000" stroke-width="3"/>
  
  <!-- Pillar 1 -->
  <text x="190" y="415" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="1">NO TRACKING</text>
  <text x="190" y="445" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="600" fill="#64748B" text-anchor="middle">Zero Data Logging</text>

  <line x1="365" y1="385" x2="365" y2="455" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Pillar 2 -->
  <text x="525" y="415" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="1">100% OFFLINE</text>
  <text x="525" y="445" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="600" fill="#64748B" text-anchor="middle">Works In Blackouts</text>

  <line x1="685" y1="385" x2="685" y2="455" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Pillar 3 -->
  <text x="840" y="415" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="1">UNFREEZABLE</text>
  <text x="840" y="445" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="600" fill="#64748B" text-anchor="middle">Direct Peer-to-Peer</text>

  <!-- Footer -->
  <line x1="50" y1="520" x2="1000" y2="520" stroke="#E2E8F0" stroke-width="2"/>
  <text x="50" y="550" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="600" fill="#64748B">HANDOUT FOR CASH PAYMENTS</text>
  <text x="1000" y="550" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#000000" text-anchor="end">FLIP FOR ESSENTIAL REASONS ➔</text>
</svg>
